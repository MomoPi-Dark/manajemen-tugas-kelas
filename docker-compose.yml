services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: class_tasks
      POSTGRES_USER: class_tracker
      POSTGRES_PASSWORD: "<POSTGRES_PASSWORD>"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U class_tracker -d class_tasks"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "postgresql://class_tracker:<POSTGRES_PASSWORD>@db:5432/class_tasks"
      TEST_DATABASE_URL: "postgresql://class_tracker:<POSTGRES_PASSWORD>@db:5432/class_tasks_test"
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "bun run db:migrate && bun run db:seed && bun run dev"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
